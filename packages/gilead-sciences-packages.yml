  (/repos, /releases/latest) plus each repo's DESCRIPTION / package.json, fetched 2026-09-12.
note: >-
  Gilead Sciences publishes no public API and therefore ships no API client libraries. What it DOES
  publish is a first-party open-source software estate: the "Good Statistical Monitoring" (gsm) suite
  of R packages for risk-based quality management of clinical trials, plus supporting visualization,
  data-simulation and QC tooling. These are research/analysis libraries, NOT SDKs for a Gilead API,
  so this file carries a `Packages` pointer only — no `SDKs` pointer is emitted, because emitting one
  would credit Gilead with an SDK count for an API that does not exist.
